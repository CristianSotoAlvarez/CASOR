# Entorno de desarrollo local — levanta con: docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: casor-postgres
    environment:
      POSTGRES_DB: casor
      POSTGRES_USER: casor
      POSTGRES_PASSWORD: casor_dev   # solo desarrollo; producción usa secretos
    ports:
      - "5432:5432"
    volumes:
      - casor_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casor"]
      interval: 5s
      retries: 10

volumes:
  casor_pgdata:
