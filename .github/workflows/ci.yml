name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore Casor.sln

      - name: Compilar
        run: dotnet build Casor.sln --no-restore --configuration Release

      - name: Tests
        run: dotnet test Casor.sln --no-build --configuration Release --verbosity normal
